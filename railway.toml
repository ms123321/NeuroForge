# Railway: Docker + single-worker gunicorn on PORT 8080
#
# Dashboard checklist:
#   Variables:  PORT=8080   SECRET_KEY=<random>
#   Public Networking port: 8080
#   Custom Start Command: (empty — use Docker CMD)
#   Healthcheck Path: (empty)  OR  /api/health with timeout >= 100

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No healthcheck — avoids "Network › Healthcheck" aborting good deploys.
# After the site works, optional: healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
