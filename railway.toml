# Railway — always start via Python (never bare `gunicorn` on PATH)
#
# Dashboard:
#   Variables: PORT=8080  SECRET_KEY=...
#   Public Networking port: 8080
#   Custom Start Command: leave EMPTY or set exactly:
#     python start.py
#   Healthcheck: leave EMPTY for first deploy

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python start.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
