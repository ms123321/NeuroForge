# Railway config
# Public Networking port = 8080  AND  Variable PORT = 8080

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Let Dockerfile CMD (start.sh) run — do NOT override with a broken startCommand
# that leaves $PORT unexpanded.
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
