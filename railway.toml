# Railway config for NeuroForge
#
# In the dashboard ALSO check:
#   Settings → Deploy → Healthcheck Path → leave EMPTY / disabled
#   Public Networking port = 8080
#   Variable PORT = 8080

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Healthcheck DISABLED — a failed probe was aborting good deploys.
# (Re-enable later with path /api/health once the app is stable.)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
