# Render Blueprint — forces correct start (not gunicorn your_application.wsgi default)
# Dashboard: New → Blueprint → ms123321/NeuroForge
# Or edit existing Web Service settings to match below.

services:
  - type: web
    name: neuroforge
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
